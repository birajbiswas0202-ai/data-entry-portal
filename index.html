<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earn Entry - Data Entry Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <!-- Navbar -->
  <nav class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-wide">DataEntryEarn</h1>
    <div id="nav-user" class="hidden flex items-center gap-4">
      <span id="user-display-name" class="font-medium"></span>
      <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-xs px-3 py-1.5 rounded transition">Logout</button>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto p-6">

    <!-- Auth Section -->
    <div id="auth-section" class="grid md:grid-cols-2 gap-8 mt-6">
      
      <!-- Register Form -->
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-semibold mb-4 text-indigo-600">Create Account</h2>
        <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
          <input type="text" id="reg-name" placeholder="Full Name" required class="w-full p-2.5 border rounded focus:ring-2 focus:ring-indigo-400 outline-none">
          <input type="tel" id="reg-phone" placeholder="Phone Number" required class="w-full p-2.5 border rounded focus:ring-2 focus:ring-indigo-400 outline-none">
          <input type="email" id="reg-email" placeholder="Email Address" required class="w-full p-2.5 border rounded focus:ring-2 focus:ring-indigo-400 outline-none">
          <input type="password" id="reg-pass" placeholder="Password" required class="w-full p-2.5 border rounded focus:ring-2 focus:ring-indigo-400 outline-none">
          <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded hover:bg-indigo-700 font-medium transition">Register & Start Earning</button>
        </form>
      </div>

      <!-- Login Form -->
      <div class="bg-white p-6 rounded-lg shadow-md h-fit">
        <h2 class="text-xl font-semibold mb-4 text-indigo-600">User Login</h2>
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
          <input type="tel" id="login-phone" placeholder="Phone Number" required class="w-full p-2.5 border rounded focus:ring-2 focus:ring-indigo-400 outline-none">
          <input type="password" id="login-pass" placeholder="Password" required class="w-full p-2.5 border rounded focus:ring-2 focus:ring-indigo-400 outline-none">
          <button type="submit" class="w-full bg-green-600 text-white py-2.5 rounded hover:bg-green-700 font-medium transition">Login</button>
        </form>
      </div>

    </div>

    <!-- User Dashboard Section -->
    <div id="dashboard-section" class="hidden space-y-6 mt-4">
      
      <!-- Stats Summary -->
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
        <div class="bg-white p-4 rounded-lg shadow text-center">
          <p class="text-sm text-gray-500">Current Balance</p>
          <p class="text-2xl font-bold text-green-600">₹<span id="dash-balance">0.00</span></p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow text-center">
          <p class="text-sm text-gray-500">Tasks Completed</p>
          <p class="text-2xl font-bold text-indigo-600" id="dash-tasks">0</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow text-center col-span-2 md:col-span-1">
          <button onclick="alert('Withdrawal feature available once balance exceeds ₹500')" class="w-full h-full bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2 rounded transition">Withdraw Funds</button>
        </div>
      </div>

      <!-- Task Work Area -->
      <div class="bg-white p-6 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-semibold text-gray-700">Data Entry Task</h2>
          <span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-1 rounded">Earn: ₹<span id="task-reward">0.00</span></span>
        </div>

        <p class="text-sm text-gray-500 mb-2">Type the target string below accurately into the input box:</p>
        <div class="bg-gray-100 p-4 rounded text-center text-xl font-mono font-bold tracking-wider select-none border border-dashed border-gray-400 mb-4" id="target-text">
          Loading task...
        </div>

        <form id="task-form" onsubmit="submitTask(event)" class="space-y-4">
          <input type="text" id="user-input" placeholder="Type data here..." autocomplete="off" required class="w-full p-3 border rounded focus:ring-2 focus:ring-indigo-500 outline-none font-mono">
          <div class="flex gap-3">
            <button type="submit" class="flex-1 bg-indigo-600 text-white py-2.5 rounded hover:bg-indigo-700 font-semibold transition">Submit Data</button>
            <button type="button" onclick="loadTask()" class="bg-gray-200 text-gray-700 px-4 py-2.5 rounded hover:bg-gray-300 transition">Skip Task</button>
          </div>
        </form>
        <p id="feedback-msg" class="text-center mt-3 text-sm font-medium"></p>
      </div>

    </div>

  </div>

  <script>
    let currentUser = null;
    let currentTask = null;

    // Load active session from local storage if available
    window.onload = () => {
      const savedUser = localStorage.getItem('user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showDashboard();
      }
    };

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const phone = document.getElementById('reg-phone').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-pass').value;

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, email, password })
      });
      const data = await res.json();
      
      if (res.ok) {
        alert(data.message);
        document.getElementById('register-form').reset();
      } else {
        alert(data.error);
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const phone = document.getElementById('login-phone').value;
      const password = document.getElementById('login-pass').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, password })
      });
      const data = await res.json();

      if (res.ok) {
        currentUser = data.user;
        localStorage.setItem('user', JSON.stringify(currentUser));
        showDashboard();
      } else {
        alert(data.error);
      }
    }

    function showDashboard() {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      document.getElementById('nav-user').classList.remove('hidden');
      document.getElementById('user-display-name').innerText = `Welcome, ${currentUser.name}`;
      updateDashboardData();
      loadTask();
    }

    async function updateDashboardData() {
      const res = await fetch(`/api/user/${currentUser.id}`);
      const data = await res.json();
      if (res.ok) {
        document.getElementById('dash-balance').innerText = data.balance.toFixed(2);
        document.getElementById('dash-tasks').innerText = data.tasks_completed;
      }
    }

    async function loadTask() {
      document.getElementById('feedback-msg').innerText = '';
      document.getElementById('user-input').value = '';

      const res = await fetch('/api/task');
      const data = await res.json();
      if (res.ok) {
        currentTask = data;
        document.getElementById('target-text').innerText = data.task_text;
        document.getElementById('task-reward').innerText = data.reward.toFixed(2);
      }
    }

    async function submitTask(e) {
      e.preventDefault();
      const userInput = document.getElementById('user-input').value;

      const res = await fetch('/api/submit-task', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: currentUser.id,
          taskId: currentTask.id,
          inputData: userInput
        })
      });

      const data = await res.json();
      const feedback = document.getElementById('feedback-msg');

      if (res.ok) {
        feedback.className = "text-center mt-3 text-sm font-medium text-green-600";
        feedback.innerText = data.message;
        document.getElementById('dash-balance').innerText = data.balance.toFixed(2);
        document.getElementById('dash-tasks').innerText = data.tasks_completed;
        setTimeout(loadTask, 1000);
      } else {
        feedback.className = "text-center mt-3 text-sm font-medium text-red-600";
        feedback.innerText = data.error;
      }
    }

    function logout() {
      localStorage.removeItem('user');
      currentUser = null;
      location.reload();
    }
  </script>
</body>
</html>
